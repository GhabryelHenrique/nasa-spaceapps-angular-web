<section class="hero" role="banner">

  <!-- Background photo com overlay -->
  <div class="hero-bg" aria-hidden="true">
    <img [src]="heroBg" alt="" class="hero-bg-photo" loading="eager">
    <div class="hero-bg-overlay"></div>
    <div class="hero-bg-gradient"></div>
  </div>

  <!-- Conteúdo centralizado -->
  <div class="hero-body">

    <!-- Badge -->
    <div class="hero-badge reveal reveal-up">
      <span class="badge-dot"></span>
      NASA Space Apps Challenge
    </div>

    <!-- Título -->
    <h1 class="hero-title reveal reveal-up delay-1">
      Uberlândia<br>
      <span class="hero-title-highlight">escreveu história</span>
    </h1>

    <!-- Subtítulo -->
    <p class="hero-subtitle reveal reveal-up delay-2">
      O maior hackathon espacial do mundo passou por aqui.<br>
      1400+ participantes. 160+ times. Uma cidade no mapa do universo.
    </p>

    <!-- CTAs -->
    <div class="hero-actions reveal reveal-up delay-3">
      <a href="https://discord.gg/FT4Jsvj5vy" class="cta-btn cta-discord" target="_blank" rel="noopener noreferrer">
        <i class="fab fa-discord"></i>
        Discord
      </a>
      <a href="https://chat.whatsapp.com/LXwUUZaJPXtBOeKr7N4axg" class="cta-btn cta-whatsapp" target="_blank" rel="noopener noreferrer">
        <i class="fab fa-whatsapp"></i>
        WhatsApp
      </a>
      <a href="https://www.instagram.com/nasaspaceappsuberlandia" class="cta-btn cta-instagram" target="_blank" rel="noopener noreferrer">
        <i class="fab fa-instagram"></i>
        Instagram
      </a>
    </div>

  </div>

  <!-- Stat bar na base do hero -->
  <div class="hero-stats reveal reveal-up delay-4">
    <div class="hero-stat">
      <span class="hero-stat-value">1400<span class="hero-stat-plus">+</span></span>
      <span class="hero-stat-label">Participantes</span>
    </div>
    <div class="hero-stat-divider" aria-hidden="true"></div>
    <div class="hero-stat">
      <span class="hero-stat-value">160<span class="hero-stat-plus">+</span></span>
      <span class="hero-stat-label">Times</span>
    </div>
    <div class="hero-stat-divider" aria-hidden="true"></div>
    <div class="hero-stat">
      <span class="hero-stat-value">#1</span>
      <span class="hero-stat-label">Hemisfério Ocidental</span>
    </div>
    <div class="hero-stat-divider" aria-hidden="true"></div>
    <div class="hero-stat">
      <span class="hero-stat-value">10</span>
      <span class="hero-stat-label">Global Nominees</span>
    </div>
  </div>

  <!-- Scroll indicator -->
  <div class="scroll-indicator" aria-hidden="true">
    <span class="scroll-dot"></span>
  </div>

</section>
