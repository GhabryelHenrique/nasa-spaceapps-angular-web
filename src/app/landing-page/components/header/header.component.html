<header class="header" [class.scrolled]="scrolled && !mobileMenuOpen">
  <nav class="navbar" role="navigation" aria-label="Navegação principal">

    <!-- Brand -->
    <a class="nav-brand" routerLink="/">
      <img class="nasa-logo" src="assets/nasa-spaceapps-logo-removebg-preview.png" alt="NASA Space Apps Challenge" loading="lazy">
      <div class="brand-text">
        <span class="brand-title">NASA Space Apps</span>
        <span class="brand-location">Uberlândia</span>
      </div>
    </a>

    <!-- Desktop nav links -->
    <ul class="nav-links" role="list">
      <li><a routerLink="/desafios" class="nav-link"><i class="fa-solid fa-trophy"></i> Desafios</a></li>
      <li><a routerLink="/times" class="nav-link"><i class="fa-solid fa-users"></i> Times</a></li>
      <li><a routerLink="/" fragment="cronograma" class="nav-link"><i class="fa-solid fa-calendar-days"></i> Cronograma</a></li>
    </ul>

    <!-- Social + auth CTAs -->
    <div class="nav-actions">
      <button class="icon-btn whatsapp" (click)="openWhatsApp()" aria-label="WhatsApp">
        <i class="fa-brands fa-whatsapp"></i>
      </button>
      <button class="icon-btn discord" (click)="joinDiscordServer()" aria-label="Discord">
        <i class="fa-brands fa-discord"></i>
      </button>
      <button class="icon-btn instagram" (click)="openInstagram()" aria-label="Instagram">
        <i class="fa-brands fa-instagram"></i>
      </button>

      <button class="hamburger" (click)="toggleMobileMenu()" [class.active]="mobileMenuOpen" aria-label="Menu">

      </button>
    </div>

  </nav>

  <!-- Mobile drawer -->
  <div class="mobile-drawer" [class.open]="mobileMenuOpen" (click)="closeMobileMenu()">
    <nav class="drawer-nav" (click)="$event.stopPropagation()">
      <a routerLink="/desafios" class="drawer-link" (click)="closeMobileMenu()"><i class="fa-solid fa-trophy"></i> Desafios</a>
